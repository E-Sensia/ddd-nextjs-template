name: Test

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: make setup

      - run: make ci

      - run: make build

      - run: pnpm exec playwright install --with-deps chromium

      - run: make test-e2e
