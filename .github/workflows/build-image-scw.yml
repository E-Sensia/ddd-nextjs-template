name: Build & Deploy to Scaleway

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      environment:
        required: true
        type: string
      stage:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    outputs:
      image:
        description: The image url with tag
        value: ${{ jobs.build-push.outputs.image }}

env:
  DOCKERFILE: ${{ inputs.dockerfile }}
  NAME: ${{ inputs.name }}
  CONTAINER_REGISTRY_ENDPOINT: ${{ (inputs.environment == 'prod') && vars.SCALEWAY_PROD_CONTAINER_REGISTRY_ENDPOINT || vars.SCALEWAY_TEST_CONTAINER_REGISTRY_ENDPOINT }}
  SCALEWAY_API_KEY: ${{ (inputs.environment == 'prod') && secrets.SCALEWAY_PROD_API_KEY || secrets.SCALEWAY_TEST_API_KEY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    name: Build and push Docker image to Scaleway Container Registry
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.CONTAINER_REGISTRY_ENDPOINT }}/${{ env.NAME }}:${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ env.SCALEWAY_API_KEY }}
          registry: ${{ env.CONTAINER_REGISTRY_ENDPOINT }}

      - name: Build the Docker image
        run: |
          docker build \
            -f $DOCKERFILE \
            -t $CONTAINER_REGISTRY_ENDPOINT/$NAME:$IMAGE_TAG \
            -t $CONTAINER_REGISTRY_ENDPOINT/$NAME:${{ inputs.stage }}-latest .

      - name: Push the Docker Image
        run: docker push $CONTAINER_REGISTRY_ENDPOINT/$NAME --all-tags
